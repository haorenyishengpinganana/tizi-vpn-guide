name: Publish & Deploy

on:
  schedule:
    - cron: '7 1 * * *' # 每天 UTC 01:07（北京时间 09:07）从队列发布
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # 定时/手动触发时才发布队列；push 触发只重新构建
      - name: Publish from queue
        if: github.event_name != 'push'
        run: node scripts/publish-from-queue.mjs "${{ vars.POSTS_PER_DAY || 1 }}"

      - name: Commit published posts
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A queue src/content/posts
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "publish: $(date -u +%F)"
          git push

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
